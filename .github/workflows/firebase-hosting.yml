# 每次网站更新（推送到 main），自动发布到 Firebase Hosting：
# https://learning-based-on-game.web.app （学校网络挡 github.io 时用这个网址）
# 发布前先删掉旧版本（只留正在用的那一个），免得超过免费的 10GB 存储（老师同意的做法）
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: 删掉旧版本（只留正在用的那一个）
        continue-on-error: true
        env:
          T: ${{ steps.auth.outputs.access_token }}
        run: |
          S=https://firebasehosting.googleapis.com/v1beta1/sites/learning-based-on-game
          H="Authorization: Bearer $T"
          CUR=$(curl -s -H "$H" "$S/channels/live" | jq -r '.release.version.name // empty')
          echo "current: $CUR"
          [ -z "$CUR" ] && { echo "找不到正在用的版本，跳过"; exit 0; }
          next=""; : > v.txt
          while :; do
            R=$(curl -s -H "$H" "$S/versions?pageSize=100${next:+&pageToken=$next}")
            echo "$R" | jq -r '.versions[]? | select(.status=="FINALIZED") | .name' >> v.txt
            next=$(echo "$R" | jq -r '.nextPageToken // empty'); [ -z "$next" ] && break
          done
          echo "versions: $(wc -l < v.txt)"
          while read v; do [ "$v" = "$CUR" ] && continue; curl -s -o /dev/null -w "%{http_code} $v\n" -X DELETE -H "$H" "https://firebasehosting.googleapis.com/v1beta1/$v"; done < v.txt
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: learning-based-on-game
          channelId: live

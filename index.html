<style>:root{--bg:#f3f6f1;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#cfdcd2;--accent:#d9442b}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;padding:16px;box-sizing:border-box}

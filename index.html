async function dec(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(D)))}
function show(h){const d=new DOMParser().parseFromString(h,'text/html');const root=document.importNode(d.documentElement,true);

  for(const old of [...root.querySelectorAll('script')]){const sc=document.createElement('script');for(const a of old.attributes)sc.setAttribute(a.name,a.value);sc.textContent=old.textContent;old.replaceWith(sc)}

async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:200000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);return new Uint8Array(await crypto.subtle.exportKey('raw',k))}
